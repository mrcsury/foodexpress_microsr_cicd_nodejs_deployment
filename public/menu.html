<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu - FoodExpress</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="menu">
  <div id="site-header"></div>

  <main class="container section">
    <h1>Our Menu</h1>
    <div class="menu-layout">
      <section aria-label="Food items">
        <form id="search-form" role="search" class="search-bar search-bar-flat">
          <label class="visually-hidden" for="search">Search food items</label>
          <input id="search" type="search" placeholder="Search by name or description..." maxlength="60" autocomplete="off">
        </form>
        <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
        <div id="menu-status" aria-live="polite"></div>
        <div class="grid" id="menu-grid"></div>
      </section>

      <aside class="cart" id="cart" aria-labelledby="cart-title">
        <h2 id="cart-title">Your Cart</h2>
        <ul class="cart-list" id="cart-list"></ul>
        <div class="totals" id="cart-totals"></div>
        <a class="btn btn-block mt-1" id="checkout-link" href="/checkout.html">Proceed to Checkout</a>
        <button class="link-btn mt-1" id="clear-cart" type="button">Clear cart</button>
      </aside>
    </div>
  </main>

  <a class="btn cart-fab" href="#cart" id="cart-fab">View cart (<span id="fab-count">0</span>)</a>

  <div id="site-footer"></div>
  <script src="/js/common.js" defer></script>
  <script src="/js/menu-card.js" defer></script>
  <script src="/js/menu.js" defer></script>
</body>
</html>
